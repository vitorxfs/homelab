global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'docker'
    # Docker daemon metrics (requires metrics-addr in /etc/docker/daemon.json)
    static_configs:
      - targets: ['host.docker.internal:9323']

  - job_name: 'cadvisor'
    # Per-container CPU, memory, network, disk I/O
    static_configs:
      - targets: ['cadvisor:8080']
